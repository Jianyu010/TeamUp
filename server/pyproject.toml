[project]
name = "teamup-server"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["argon2-cffi>=25,<27", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
teamup-server = "teamup_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "../scripts/package_version.py"
search-paths = [".."]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../scripts/package_version.py" },
    { file = "../scripts/ci/version.py" },
    { file = "../TEAMUP-VERSION" },
    { env = "TEAMUP_VERSION" },
    { git = { commit = true, tags = true } },
]
