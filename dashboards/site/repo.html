<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>仓库热度</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="repo">
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html">TeamUp CI</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">概览</a>
          <a href="repo.html" aria-current="page">仓库</a>
          <a href="performance.html">性能</a>
          <a href="agents.html">Agent</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>仓库热度</h1>
      <p class="lede">每天一行仓库统计，空值表示接口不可读。</p>

      <section class="card">
        <h2>Stars、Watchers、Forks</h2>
        <div class="chart-frame"><canvas id="popularity-chart"></canvas></div>
        <p class="empty" data-empty="popularity-chart" hidden>暂无仓库统计数据。</p>
      </section>

      <section class="card">
        <h2>开放 Issue 与 PR</h2>
        <div class="chart-frame"><canvas id="open-chart"></canvas></div>
        <p class="empty" data-empty="open-chart" hidden>暂无仓库统计数据。</p>
      </section>

      <section class="card">
        <h2>每日 Issue 与 PR 活动</h2>
        <div class="chart-frame"><canvas id="activity-chart"></canvas></div>
        <p class="empty" data-empty="activity-chart" hidden>暂无仓库统计数据。</p>
      </section>

      <section class="card">
        <h2>距上次发布天数</h2>
        <div class="chart-frame"><canvas id="release-age-chart"></canvas></div>
        <p class="empty" data-empty="release-age-chart" hidden>暂无发布数据。</p>
      </section>

      <section class="card">
        <h2>下载与 14 天访问</h2>
        <div class="chart-frame"><canvas id="traffic-chart"></canvas></div>
        <p class="empty" data-empty="traffic-chart" hidden>暂无下载或访问数据。</p>
      </section>

      <section class="card">
        <h2>发布记录</h2>
        <div class="table-wrap">
          <table id="releases-table">
            <thead>
              <tr>
                <th>Tag</th>
                <th>类型</th>
                <th>日期</th>
                <th>PR 数</th>
              </tr>
            </thead>
            <tbody id="releases-body"></tbody>
          </table>
        </div>
        <p id="releases-empty" class="empty" hidden>暂无发布记录。</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">Data: ci-data branch · generated by TeamUp CI</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="assets/app.js" defer></script>
  </body>
</html>
