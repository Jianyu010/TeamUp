<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent 看板</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="agents">
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html">TeamUp CI</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">概览</a>
          <a href="ci.html">CI</a>
          <a href="repo.html">仓库</a>
          <a href="performance.html">性能</a>
          <a href="agents.html" aria-current="page">Agent</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>Agent 看板</h1>
      <p class="lede">weekly Agent E2E 指标与场景状态历史。</p>

      <div class="controls">
        <label for="metric-stat">指标统计量</label>
        <select id="metric-stat">
          <option value="p50" selected>p50</option>
          <option value="p95">p95</option>
          <option value="p99">p99</option>
          <option value="mean">mean</option>
        </select>
      </div>

      <div id="metric-charts" class="metric-grid"></div>
      <p id="metric-empty" class="empty" hidden>暂无性能指标。</p>

      <section class="card">
        <h2>最近一次运行场景</h2>
        <div class="table-wrap">
          <table id="latest-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>标题</th>
                <th>状态</th>
                <th>耗时</th>
              </tr>
            </thead>
            <tbody id="latest-body"></tbody>
          </table>
        </div>
        <p id="latest-empty" class="empty" hidden>暂无场景结果。</p>
      </section>

      <section class="card">
        <h2>场景状态历史</h2>
        <div class="table-wrap">
          <table id="status-grid-table" class="status-grid">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="status-grid-empty" class="empty" hidden>暂无场景历史。</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">Data: ci-data branch · generated by TeamUp CI</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="assets/app.js" defer></script>
  </body>
</html>
