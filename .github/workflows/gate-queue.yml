# Layer 5 · what follows a PR's checks and its Gate run, and the merger (docs/ci/README.md).
# Ported from tweakie's gate-queue.yml. Every job fetches main's scripts through the contents API
# and runs them on a trusted `teamup-merge` runner; no PR code runs here.
#
# - revoke: a PR-checks run that ends without success fails `merge-gate` on its commit.
# - auto: the automatic route. When PR checks pass on a head, `merge-gate` goes green when every
#   required check passed, layer 1 holds nothing, the OpenCode review of that head is clean with
#   every finding answered, and the PR is not a draft, on `pr/hold`, or conflicting. When only the
#   review is missing, auto dispatches it (opencode-review.yml); its wake-gate job re-judges.
# - merge: the merger. Merges every open PR whose `merge-gate` is green, oldest first, with a merge
#   commit pinned to the judged head. With TEAMUP_MERGE_TOKEN it merges as the owner, so push
#   workflows (PR checks on main) start; without it, with the workflow token, they do not. While
#   an open `ci/freeze` issue exists only PRs the owner passed with `ready` merge.
# - main-health: PR checks on a push to main; red freezes auto-merge, green thaws it.
# - pr-labels: gate/*-failed, mirrored type/* and pr/no-issue (docs/ci/labeling.md); advisory.
name: Gate queue

on:
  workflow_run:
    workflows: [PR checks, Gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate by the automatic route (empty = the sweep)
        required: false
        type: number
      merge_dry_run:
        description: The merger only prints what it would do
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *" # fallback; GitHub fires it late, so gate-tick.yml also dispatches it

permissions: {}

env:
  FETCH: scripts/ci/gate.py scripts/ci/merge.py scripts/ci/freeze.py scripts/ci/labels.py .github/ci/policy.json docs/ci/labeling.md

jobs:
  revoke:
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
      && !contains(fromJSON('["success","skipped"]'), github.event.workflow_run.conclusion) }}
    runs-on: [self-hosted, teamup-merge]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Fetch main's gate (contents API, not git)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gate"
          for f in $FETCH; do
            mkdir -p "$RUNNER_TEMP/gate/$(dirname "$f")"
            curl -fsSL --connect-timeout 10 --max-time 15 --retry 3 --retry-delay 2 --retry-max-time 55 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/gate/$f" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$REF"
          done
      - working-directory: ${{ runner.temp }}/gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || github.event.action }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -E -s -m scripts.ci.gate revoke --sha "$SHA" --workflow "$WORKFLOW" --conclusion "$CONCLUSION" --run-id "$RUN_ID"

  auto:
    if: >-
      ${{ github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || (github.event_name == 'workflow_run'
      && contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)
      && github.event.workflow_run.name != 'Gate'
      && github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, teamup-merge]
    timeout-minutes: 5
    concurrency:
      group: gate-auto-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || inputs.pr || 'sweep' }}
      cancel-in-progress: true
    permissions:
      actions: write # dispatch the AI review, re-run a review run that left no review
      contents: read
      checks: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Fetch main's gate (contents API, not git)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gate"
          for f in $FETCH; do
            mkdir -p "$RUNNER_TEMP/gate/$(dirname "$f")"
            curl -fsSL --connect-timeout 10 --max-time 15 --retry 3 --retry-delay 2 --retry-max-time 55 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/gate/$f" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$REF"
          done
      - working-directory: ${{ runner.temp }}/gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SWEEP: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.pr) }}
        run: |
          if [ "$SWEEP" = "true" ]; then
            python3 -E -s -m scripts.ci.gate auto --all
          elif [ -n "$PR" ]; then
            python3 -E -s -m scripts.ci.gate auto --pr "$PR"
          else
            python3 -E -s -m scripts.ci.gate auto --sha "$SHA"
          fi

  pr-labels:
    # docs/ci/labeling.md: gate/*-failed from the required checks and the review, type/* mirrored
    # from linked issues, pr/no-issue. Advisory only: the gate never reads these labels.
    if: >-
      ${{ github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || (github.event_name == 'workflow_run'
          && contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)) }}
    runs-on: [self-hosted, teamup-merge]
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: pr-labels-${{ github.event.workflow_run.head_sha || inputs.pr || 'sweep' }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Fetch main's scripts (contents API, not git)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/labels"
          for f in $FETCH; do
            mkdir -p "$RUNNER_TEMP/labels/$(dirname "$f")"
            curl -fsSL --connect-timeout 10 --max-time 15 --retry 3 --retry-delay 2 --retry-max-time 55 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/labels/$f" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$REF"
          done
      - working-directory: ${{ runner.temp }}/labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$PR" ]; then
            python3 -E -s -m scripts.ci.labels pr --pr "$PR"
          elif [ -n "$SHA" ]; then
            python3 -E -s -m scripts.ci.labels pr --sha "$SHA"
          else
            python3 -E -s -m scripts.ci.labels pr --all
          fi

  merge:
    needs: [revoke, auto]
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || (github.event_name == 'workflow_run'
          && ((github.event.workflow_run.name == 'Gate' && github.event.workflow_run.conclusion != 'skipped')
              || (github.event.workflow_run.name == 'PR checks' && github.event.workflow_run.event == 'push')
              || (contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)
                  && github.event.workflow_run.conclusion == 'success')))) }}
    runs-on: [self-hosted, teamup-merge]
    timeout-minutes: 10
    concurrency:
      group: merge-queue # one merger at a time: merges into main stay sequential
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Fetch main's gate (contents API, not git)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gate"
          for f in $FETCH; do
            mkdir -p "$RUNNER_TEMP/gate/$(dirname "$f")"
            curl -fsSL --connect-timeout 10 --max-time 15 --retry 3 --retry-delay 2 --retry-max-time 55 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/gate/$f" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$REF"
          done
      - working-directory: ${{ runner.temp }}/gate
        env:
          GITHUB_TOKEN: ${{ secrets.TEAMUP_MERGE_TOKEN || github.token }}
          MERGE_WITH_TOKEN: ${{ secrets.TEAMUP_MERGE_TOKEN != '' }}
          CHECKS_TOKEN: ${{ github.token }} # statuses, check runs, freeze issues
          DRY_RUN: ${{ (inputs.merge_dry_run || vars.MERGER == 'dry-run') && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -E -s -m scripts.ci.merge --dry-run
          else
            python3 -E -s -m scripts.ci.merge
          fi

  main-health:
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'PR checks'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion) }}
    runs-on: [self-hosted, teamup-merge]
    timeout-minutes: 5
    concurrency:
      group: freeze-main
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch main's gate (contents API, not git)
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gate"
          for f in $FETCH; do
            mkdir -p "$RUNNER_TEMP/gate/$(dirname "$f")"
            curl -fsSL --connect-timeout 10 --max-time 15 --retry 3 --retry-delay 2 --retry-max-time 55 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/gate/$f" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$f?ref=$REF"
          done
      - working-directory: ${{ runner.temp }}/gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            python3 -E -s -m scripts.ci.freeze clear --source main --url "$URL"
          else
            python3 -E -s -m scripts.ci.freeze set --source main --url "$URL" \
              --reason "PR checks on main at \`${SHA:0:7}\` concluded $CONCLUSION."
          fi
