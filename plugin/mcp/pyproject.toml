[project]
name = "teamup-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "teamup-client"]

[project.scripts]
teamup-mcp = "teamup_mcp.main:main"

[tool.uv.sources]
teamup-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
