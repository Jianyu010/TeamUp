[project]
name = "teamup-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["client", "server", "plugin/mcp"]

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests", "server/tests"]
pythonpath = [".", "client/src", "server/src", "plugin/mcp/src"]

[tool.ruff]
target-version = "py312"
