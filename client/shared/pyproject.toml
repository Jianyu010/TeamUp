[project]
name = "teamup-client"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.scripts]
teamup-client = "teamup_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "../../scripts/package_version.py"
search-paths = ["../.."]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../scripts/package_version.py" },
    { file = "../../scripts/ci/version.py" },
    { file = "../../TEAMUP-VERSION" },
    { file = "../../.git/shallow" },
    { env = "TEAMUP_VERSION" },
    { git = { commit = true, tags = true } },
]
