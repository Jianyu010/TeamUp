<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TeamUp</title>
  <link rel="stylesheet" href="/console.css">
  <script type="module" src="/console.js"></script>
</head>
<body>
  <main class="console" aria-label="TeamUp Client Console">
    <header class="chrome">
      <h1><img alt="" width="34" height="34" src="/jet-pair.png">TeamUp</h1>
      <nav aria-label="Client navigation">
        <button type="button" id="workspace-nav" aria-pressed="true">Workspace</button>
        <button type="button" id="team-nav" aria-pressed="false">Team</button>
      </nav>
      <span id="connection" role="status">Connecting</span>
    </header>

    <div id="stage" class="stage" data-page="workspace">
      <svg id="links" aria-hidden="true"></svg>
      <section class="session-panel" aria-labelledby="sessions-title">
        <h2 id="sessions-title">My sessions (0)</h2>
        <div class="scroll-frame" id="session-scroll">
          <div class="nodes" id="sessions"></div>
        </div>
      </section>
      <section class="room-panel" aria-labelledby="rooms-title">
        <h2 id="rooms-title">Rooms</h2>
        <button type="button" id="back" hidden>‹ Workspace <span id="compact-room"></span></button>
        <div class="scroll-frame" id="room-scroll">
          <div class="nodes" id="rooms"></div>
        </div>
      </section>

      <section class="detail" id="detail" aria-label="Room details" inert>
        <div class="room-main">
          <section class="billboard" aria-label="Room information">
            <div class="board-heading">
              <h2>Board</h2>
              <span id="board-status"></span>
            </div>
            <div class="room-id">
              <label for="room-id">Room ID</label>
              <input type="text" readonly id="room-id" spellcheck="false">
              <div class="copy-control">
                <button type="button" id="copy-room" aria-label="Copy room ID"><span class="copy-mark" aria-hidden="true"></span></button>
                <span id="copy-tip" class="copy-tip" role="tooltip">Copy room ID</span>
              </div>
              <span id="copy-status" class="sr-only" role="status"></span>
            </div>
          </section>
          <div class="chat-heading">
            <nav class="room-tabs" aria-label="Room views">
              <button type="button" id="tasks-tab" aria-pressed="false">Tasks</button>
              <button type="button" id="chats-tab" aria-pressed="true">Chats</button>
            </nav>
          </div>
          <section class="scroll-frame" id="chat-scroll" aria-label="Room chat">
            <p id="history-boundary" class="muted"></p>
            <button type="button" id="older" hidden>Older messages</button>
            <p id="chat-status" role="status"></p>
            <div id="messages"></div>
          </section>
          <section id="task-board" class="task-board" aria-label="Room tasks" hidden>
            <div class="task-toolbar">
              <label>Acting as <select id="task-actor"></select></label>
              <div id="task-lane-nav" aria-label="Task panels"></div>
              <button type="button" id="finished-tasks" aria-pressed="false">Finished</button>
              <button type="button" id="more-tasks" hidden>More tasks</button>
            </div>
            <p id="task-status" class="muted" role="status"></p>
            <div id="task-lanes" class="task-lanes"></div>
          </section>
        </div>
        <aside class="roster" aria-labelledby="roster-title">
          <h2 id="roster-title">Members</h2>
          <p id="roster-status" class="muted" role="status"></p>
          <div id="roster" class="scroll-frame"></div>
        </aside>
      </section>
      <section class="team-panel scroll-frame" id="team-panel" aria-label="Team" hidden>
        <h2>Team</h2>
        <p id="team-status" role="status"></p>
        <ul id="team-list"></ul>
      </section>
    </div>
  </main>
  <section id="member-detail" popover="manual" aria-label="Room member details"></section>
</body>
</html>
